name: CI

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

on:
  push:
    branches: [ main, "feat/**", "refactor/**" ]
    tags: [ "v*" ]
  pull_request:
    branches: [ main ]

jobs:
  verify-ele:
    name: Univalent HoTT/GDSII + SEARU x FLOW Silicon + 12x SAT QED + 0-ULP Co-Sim (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ ubuntu-latest, macos-latest ]
    steps:
      - name: Checkout FLOW (main)
        uses: actions/checkout@v4
        with:
          repository: hianova/FLOW
          ref: main
          path: FLOW

      - name: Checkout ELE
        uses: actions/checkout@v4
        with:
          path: ELE

      - name: Install Lean 4 Toolchain
        run: |
          curl -sSf https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh | sh -s -- -y --default-toolchain leanprover/lean4:v4.36.0
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"

      - name: Install Clang, Verilator & Yosys (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y clang verilator yosys

      - name: Install Verilator & Yosys (macOS)
        if: runner.os == 'macOS'
        run: |
          brew install verilator yosys

      - name: Run All ELE v8.0.0 Silicon, OPC/GDSII & Formal Sign-Off Gates
        run: |
          make -C ELE clean && make -C ELE test
