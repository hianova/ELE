name: CI

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

on:
  push:
    branches: [ main, "feat/**", "refactor/**" ]
    tags: [ "v*" ]
  pull_request:
    branches: [ main ]

jobs:
  verify-ele:
    name: FLOW Self-Hosting Silicon Bootstrap + 7x SAT QED + 0-ULP Co-Sim (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ ubuntu-latest, macos-latest ]
    steps:
      - name: Checkout FLOW (v6.0.0)
        uses: actions/checkout@v4
        with:
          repository: hianova/FLOW
          ref: v6.0.0
          path: FLOW

      - name: Checkout ELE
        uses: actions/checkout@v4
        with:
          path: ELE

      - name: Install Clang, Verilator & Yosys (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y clang verilator yosys

      - name: Install Verilator & Yosys (macOS)
        if: runner.os == 'macOS'
        run: |
          brew install verilator yosys

      - name: Run All 5 ELE v6.0.0 Self-Hosting Silicon Sign-Off Gates
        run: |
          make -C ELE clean && make -C ELE test
