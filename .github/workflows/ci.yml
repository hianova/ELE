name: CI

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

on:
  push:
    branches: [ main, "feat/**", "refactor/**" ]
    tags: [ "v*" ]
  pull_request:
    branches: [ main ]

jobs:
  verify-ele:
    name: Univalent HoTT/GDSII + SEARU x FLOW Silicon + 12x SAT QED + 0-ULP Co-Sim (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ ubuntu-latest, macos-latest ]
    steps:
      - name: Checkout FLOW (main)
        uses: actions/checkout@v6
        with:
          repository: hianova/FLOW
          ref: main
          path: FLOW

      - name: Checkout ELE
        uses: actions/checkout@v6
        with:
          path: ELE

      - name: Cache Lean 4 Toolchain
        uses: actions/cache@v5
        with:
          path: ~/.elan
          key: ${{ runner.os }}-${{ runner.arch }}-elan-lean-4.36.0

      - name: Install Lean 4 Toolchain
        run: |
          set -euo pipefail
          if ! "$HOME/.elan/bin/lean" --version >/dev/null 2>&1; then
            curl --retry 5 -sSfL https://elan.lean-lang.org/elan-init.sh -o /tmp/elan-init.sh
            sh /tmp/elan-init.sh -y --default-toolchain leanprover/lean4:v4.36.0
          fi
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"

      - name: Install Clang, Verilator & Yosys (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y clang verilator yosys

      - name: Install Verilator & Yosys (macOS)
        if: runner.os == 'macOS'
        run: |
          brew install verilator yosys

      - name: Run All ELE v8.0.0 Silicon, OPC/GDSII & Formal Sign-Off Gates
        run: |
          make -C ELE clean && make -C ELE test
